
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Book Catalog</title>
</head>

<body>

<h1>Book Catalog</h1>

<!-- Book search form -->
<form th:action="@{/catalog}" method="get">

    <input type="text"
           name="query"
           th:value="${query}"
           placeholder="Search for books">

    <button type="submit">Search</button>

</form>

<h2>Search Results</h2>

<!-- Results table -->
<table border="1">
    <thead>
    <tr>
        <th>ISBN</th>
        <th>Title</th>
        <th>Author</th>
        <th>Description</th>
        <th>Action</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.isbn}"></td>
        <td th:text="${book.title}"></td>
        <td th:text="${book.author}"></td>
        <td th:text="${book.description}"></td>

        <!-- Add to Cart button -->
        <td>
            <form th:action="@{/cart/add}" method="post">

                <input type="hidden"
                       name="isbn"
                       th:value="${book.isbn}">

                <button type="submit">
                    Add to Cart
                </button>

            </form>
        </td>
    </tr>
    </tbody>
</table>

<p th:if="${!#strings.isEmpty(query) and #lists.isEmpty(books)}">
    No books found.
</p>

<p>
    <a th:href="@{/cart}">View Shopping Cart</a>
</p>

</body>
</html>
