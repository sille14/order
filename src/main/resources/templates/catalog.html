
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Book Catalog</title>
</head>

<body>

<h1>Book Catalog</h1>

<!-- Book search form -->
<form th:action="@{/catalog}" method="get">

    <input type="text"
           name="query"
           th:value="${query}"
           placeholder="Search for books">

    <button type="submit">Search</button>

</form>

<h2>Search Results</h2>

<!-- Results table -->
<table border="1">
    <thead>
    <tr>
        <th>ISBN</th>
        <th>Title</th>
        <th>Author</th>
        <th>Description</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.isbn}"></td>
        <td th:text="${book.title}"></td>
        <td th:text="${book.author}"></td>
        <td th:text="${book.description}"></td>
    </tr>
    </tbody>
</table>

<!-- No results message -->
<p th:if="${!#strings.isEmpty(query) and #lists.isEmpty(books)}">
    No books found.
</p>

</body>
</html>
